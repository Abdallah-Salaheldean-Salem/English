<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://fonts.googleapis.com https://fonts.gstatic.com"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Writing"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}</style></head><body><title>English Writing Recovery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an exercise book. Left rail of tabs, one reading column, ruled sheets with a margin line for writing. */
:root {
  --paper: #edf0f3; --sheet: #fbfcfd; --ink: #17202b; --ink2: #4b5667; --faint: #7b8696;
  --rule: #d6dce4; --line: #c9d3e0; --margin: #e2a59b;
  --blue: #22468c; --blue-soft: #e2e9f6; --red: #b5412c; --red-soft: #f6e4df; --green: #2c7250; --green-soft: #dfefe6; --amber: #8f6210;
  --f-write: 'Literata', Georgia, 'Times New Roman', serif;
  --f-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f141b; --sheet: #161d27; --ink: #e2e7ee; --ink2: #a3adbb; --faint: #7f8a9a;
  --rule: #263140; --line: #2b3746; --margin: #7a3f37;
  --blue: #93aee8; --blue-soft: #1c2840; --red: #ee8169; --red-soft: #3a221d; --green: #6dc597; --green-soft: #183326; --amber: #e2b158; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f141b; --sheet: #161d27; --ink: #e2e7ee; --ink2: #a3adbb; --faint: #7f8a9a;
  --rule: #263140; --line: #2b3746; --margin: #7a3f37;
  --blue: #93aee8; --blue-soft: #1c2840; --red: #ee8169; --red-soft: #3a221d; --green: #6dc597; --green-soft: #183326; --amber: #e2b158; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font: 15px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-write); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.01em; }
h2 { font-size: 22px; }
h3 { font-size: 16px; font-family: var(--f-ui); font-weight: 600; }
p { margin: 0; }
.eyebrow { font: 500 11px/1.4 var(--f-ui); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.muted { color: var(--ink2); } .small { font-size: 13px; } small { font-size: 12px; }
.good { color: var(--green); } .warn { color: var(--red); } .note { color: var(--amber); }
.lead { font-size: 16px; max-width: 62ch; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* shell */
#shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; padding: 28px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 26px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--f-write); }
.nib { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--blue); box-shadow: inset 0 0 0 5px var(--paper); }
.phasebox strong { display: block; font: 600 18px var(--f-write); margin: 2px 0 8px; }
.phasedots { display: flex; gap: 6px; }
.phasedots i { width: 26px; height: 4px; border-radius: 2px; background: var(--rule); }
.phasedots i.past { background: var(--ink2); } .phasedots i.now { background: var(--blue); }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { padding: 8px 10px; border-radius: var(--r); color: var(--ink2); text-decoration: none; font-weight: 500; }
#nav a.on { background: var(--sheet); color: var(--ink); box-shadow: inset 3px 0 0 var(--blue); }
#view { padding-block: 36px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.page.wide { max-width: 1080px; }
.pad { padding: 40px; }
.pagehead { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.status { position: fixed; right: 0; bottom: 0; padding: 6px 14px; padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--faint); display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; pointer-events: none; }
.status .warn { color: var(--red); background: var(--red-soft); padding: 2px 8px; border-radius: 4px; pointer-events: auto; }

/* cards and bits */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.next { border-color: var(--blue); box-shadow: 0 1px 0 var(--rule), inset 4px 0 0 var(--blue); padding: 24px 26px; }
.card.next h2 { font-size: 26px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.anchor { font: italic 17px/1.5 var(--f-write); color: var(--ink2); max-width: 60ch; }
.anchor em { color: var(--ink); font-style: normal; border-bottom: 1px solid var(--line); }
.anchor.form input { font: inherit; font-style: normal; border: 0; border-bottom: 1.5px solid var(--blue); background: transparent; color: var(--ink); width: 15em; max-width: 100%; padding: 2px 2px; border-radius: 0; }
.alert { background: var(--red-soft); color: var(--red); padding: 10px 14px; border-radius: var(--r); font-size: 14px; }
.pill { display: inline-block; font: 500 11px/1 var(--f-ui); padding: 4px 8px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); text-transform: lowercase; white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green); } .pill.red { background: var(--red-soft); color: var(--red); text-transform: none; }
.tag { font: 500 12px var(--f-ui); color: var(--red); }
.bar { display: inline-block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; width: 100%; }
.bar > span { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.scroll { overflow-x: auto; max-width: 100%; }

/* controls */
.btn { font: 500 14px var(--f-ui); padding: 9px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--sheet); }
.btn.big { padding: 12px 22px; font-size: 15px; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink2); }
.btn.danger { color: var(--red); }
.icon { border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 16px; padding: 2px 8px; border-radius: 4px; line-height: 1; }
.icon:disabled { opacity: .3; cursor: default; }
input[type=text], input[type=url], input[type=date], input[type=number], select {
  font: 14px var(--f-ui); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-width: 0; max-width: 100%; }
input.big { font: 18px var(--f-write); padding: 12px 14px; background: var(--sheet); width: 100%; }
input.num { width: 80px; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 14px; }
.field input, .field select { font-weight: 400; }
.field.inline { flex-direction: row; align-items: center; flex-wrap: wrap; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--blue); width: 16px; height: 16px; flex: none; }
.check small { display: block; color: var(--ink2); margin-top: 2px; }
.days { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 400; }
details summary { cursor: pointer; color: var(--ink2); font-size: 14px; }
details[open] summary { margin-bottom: 10px; }

/* the writing sheet: ruled lines, margin line */
.sheet { --lh: 30px; width: 100%; display: block; font: 18px/var(--lh) var(--f-write); color: var(--ink); resize: vertical;
  background-color: var(--sheet); border: 1px solid var(--line); border-radius: var(--r);
  background-image: linear-gradient(90deg, transparent 46px, var(--margin) 46px, var(--margin) 47px, transparent 47px),
                    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh));
  background-attachment: local; background-position: 0 14px; padding: 14px 18px 14px 62px; caret-color: var(--blue); }
.sheet.small { --lh: 26px; font-size: 16px; padding-left: 18px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh)); }
.sheet.readonly { background-color: var(--paper); }
.sheet:focus { outline: none; border-color: var(--blue); }
.meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--ink2); }
.count { font: 500 13px var(--f-mono); color: var(--ink2); font-variant-numeric: tabular-nums; }
.count.ok { color: var(--green); } .count.warn, .pause.warn { color: var(--red); }
.pause { font: 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.prose { font: 17px/1.75 var(--f-write); white-space: pre-wrap; overflow-wrap: anywhere; }
mark.mk { background: transparent; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
mark.mk.claude { text-decoration-color: var(--red); text-decoration-style: wavy; }
mark.mk.self { text-decoration-color: var(--blue); }
mark.mk.ai { text-decoration-color: var(--faint); text-decoration-style: dotted; }
mark.mk.fixed { text-decoration-color: var(--green); text-decoration-style: solid; }
mark.mk sup { font: 600 10px var(--f-mono); color: var(--red); margin-left: 1px; }
.model { margin: 0; padding: 18px 22px; border-left: 3px solid var(--ink2); background: var(--paper); border-radius: 0 var(--r) var(--r) 0; }
.model blockquote { margin: 0 0 10px; font: 17px/1.7 var(--f-write); }
.model figcaption { font-size: 13px; color: var(--ink2); }
.topic { font: italic 19px/1.4 var(--f-write); }
.topicrow { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.rules { margin: 0; padding-left: 18px; color: var(--ink2); font-size: 14px; display: flex; flex-direction: column; gap: 3px; }

/* today */
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week li { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: var(--r); font-size: 12px; color: var(--ink2); }
.week li i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.week li.did i { background: var(--blue); border-color: var(--blue); }
.week li.wkend { background: var(--paper); }
.week li.today { box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--ink); font-weight: 600; }
.week small { font-family: var(--f-mono); font-size: 11px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-top: 12px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.opt > div:first-child { flex: 1 1 240px; min-width: 0; }

/* plan */
.card.phase.past { opacity: .78; }
.card.phase.current { border-color: var(--ink2); }
.phead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phead .eyebrow { flex-basis: 100%; }
.gate ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.gate li { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(80px, 160px) auto; gap: 10px; align-items: center; font-size: 14px; }
.gate .tick { width: 18px; height: 18px; border: 1.5px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: var(--sheet); }
.gate li.met .tick { background: var(--green); border-color: var(--green); }
.gate li.met .bar > span { background: var(--green); }
.gv { font: 12px var(--f-mono); color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th { text-align: left; font: 500 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl td.b { font-weight: 600; } .tbl td.wrote { font-family: var(--f-write); }
.tbl td input { width: 100%; min-width: 140px; }
.books, .links, .models, .drills, .crits, .typebars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.models li, .crits li { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.drills li { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.typebars li { display: grid; grid-template-columns: minmax(0, 180px) 1fr 34px; gap: 10px; align-items: center; font-size: 13px; }
.typebars .bar > span { background: var(--red); }
.top3 { display: flex; gap: 8px; flex-wrap: wrap; }

/* writing */
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 22px; align-items: start; }
.itemsnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 60px); overflow-y: auto; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.item { width: 100%; text-align: left; display: grid; gap: 3px; padding: 10px 12px; border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
.item.on { background: var(--sheet); border-color: var(--line); box-shadow: inset 3px 0 0 var(--blue); }
.it-t { font-weight: 600; font-size: 14px; } .it-m { font-size: 12px; color: var(--ink2); } .it-s { display: flex; gap: 4px; flex-wrap: wrap; }
.detail { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; min-width: 0; }
.review { background: var(--blue-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.review.done { background: var(--paper); } .review.busy { color: var(--blue); }
.marks h3 { margin-bottom: 8px; }
.marks ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; }
.marks li { font-size: 14px; }
.marks li.fixed { opacity: .82; }
.mhead { display: flex; gap: 10px; align-items: center; } .by { font-size: 12px; color: var(--faint); margin-right: auto; }
.ctx { font: 16px/1.6 var(--f-write); margin: 4px 0; }
.hint { color: var(--blue); } .hint.warn { color: var(--red); }
.repair, .markrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.repair input, .markrow input { flex: 1 1 180px; }
.marker { display: flex; flex-direction: column; gap: 8px; }
.marklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.marklist .q { font-family: var(--f-write); }
.piece { display: flex; flex-direction: column; gap: 14px; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; flex-wrap: wrap; }
.stages li { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--paper); color: var(--faint); }
.stages li.past { color: var(--ink2); } .stages li.now { background: var(--blue); color: var(--sheet); }
.checklist { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; margin: 0; }
.checklist legend { font-weight: 600; font-size: 14px; padding: 0 6px; }
.feedback ul { margin: 6px 0; padding-left: 18px; font-size: 14px; }
.advance { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; }
.stat strong { font: 500 26px var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink2); }
.chart { width: 100%; min-width: 420px; height: auto; display: block; }
.chart .grid { stroke: var(--rule); } .chart .ax { fill: var(--faint); font: 10px var(--f-mono); }
.chart .b { fill: var(--line); } .chart .b.last { fill: var(--blue); } .chart .dot { fill: var(--ink2); }

/* focus mode */
.focus { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body.in-focus { overflow: hidden; }
.focus-inner { max-width: 820px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.focus-head { position: sticky; top: 0; z-index: 2; background: var(--paper); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 18px 0 14px; border-bottom: 1px solid var(--rule); }
.fh-left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.steps li { font-size: 13px; color: var(--faint); padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule); }
.steps li small { font-family: var(--f-mono); font-size: 10px; margin-left: 4px; }
.steps li.past { color: var(--ink2); background: var(--sheet); } .steps li.now { color: var(--sheet); background: var(--ink); border-color: var(--ink); }
.clock { font: 500 clamp(36px, 7vw, 52px)/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--ink); }
.clock.over { color: var(--amber); }
.focus-body { flex: 1; padding: 22px 0; }
.focus-foot { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.focus-foot #next, .focus-foot .btn.primary { margin-left: auto; }
.stop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stepmsg { font-size: 13px; color: var(--red); opacity: 0; transition: opacity .2s; flex: 1 1 200px; }
.stepmsg.on { opacity: 1; }
.done h2 { font-size: 28px; }
.notes, .pairs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; }
.noterow .src { font: 15px/1.55 var(--f-write); color: var(--ink2); margin-bottom: 6px; }
.noteinput { display: flex; gap: 8px; align-items: center; } .noteinput input { flex: 1; }
.notelist { margin: 0; padding-left: 22px; font-size: 15px; display: flex; flex-direction: column; gap: 3px; color: var(--ink2); }
.source6 { margin: 0; padding-left: 22px; font: 16px/1.6 var(--f-write); }
.way { display: flex; flex-direction: column; gap: 6px; }
.movelist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: mv; }
.movelist li { display: flex; align-items: center; gap: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; counter-increment: mv; }
.movelist li::before { content: counter(mv); font: 12px var(--f-mono); color: var(--faint); width: 16px; }
.mv-text { flex: 1; min-width: 0; } .mv-btns { display: flex; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

<script>
/* ==== src/pwa_bridge.js ==== */
/* pwa_bridge.js: phone app build only (pwa/). Defines window.desktop on the phone itself:
   documents in IndexedDB (persistent storage requested), Claude through the person's own Anthropic API key
   called directly from the phone, and backups through the share sheet or a download.
   desktop_shim.js then maps window.desktop onto window.claude.use(), so the app code is unchanged. */
'use strict';
(() => {
  if (window.desktop || !window.indexedDB) return;
  const MODEL = 'claude-sonnet-5-5';
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ewr', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('secrets'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  /* Run fn(store) in one transaction; resolve when it commits. */
  const tx = async (name, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(name, mode), out = { value: undefined };
      fn(t.objectStore(name), out);
      t.oncomplete = () => res(out.value);
      t.onerror = t.onabort = () => rej(new Error(t.error ? t.error.name : 'storage_error'));
    });
  };
  const getKey = () => tx('secrets', 'readonly', (s, out) => { const r = s.get('anthropic'); r.onsuccess = () => { out.value = r.result || null; }; });

  window.desktop = {
    kind: 'phone',
    readAll: () => tx('docs', 'readonly', (s, out) => {
      out.value = {};
      const c = s.openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.value[cur.key] = cur.value; cur.continue(); } };
    }),
    write: (p, body) => tx('docs', 'readwrite', s => { s.put(body, p); }),
    remove: p => tx('docs', 'readwrite', s => { s.delete(p); }),
    hasKey: async () => !!(await getKey()),
    setKey: async k => { if (!/^sk-ant-[A-Za-z0-9_\-]{20,}$/.test(k)) throw new Error('That is not an Anthropic API key.'); await tx('secrets', 'readwrite', s => { s.put(k, 'anthropic'); }); return true; },
    clearKey: async () => { await tx('secrets', 'readwrite', s => { s.delete('anthropic'); }); return true; },
    ask: async prompt => {
      const key = await getKey();
      if (!key) throw new Error('not_granted');
      let r;
      try {
        r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: MODEL, max_tokens: 4000, messages: [{ role: 'user', content: prompt }] })
        });
      } catch (e) { throw new Error('upstream_error'); }
      if (r.status === 401 || r.status === 403) throw new Error('not_granted');
      if (r.status === 429 || r.status === 529) throw new Error('rate_limited');
      if (r.status === 413) throw new Error('prompt_too_large');
      if (!r.ok) throw new Error('upstream_error');
      const j = await r.json();
      if (j.stop_reason === 'refusal') throw new Error('refused');
      return (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
    },
    /* Share sheet where the phone offers one (save to Files or Drive, send to yourself); a download otherwise. */
    saveFile: async (name, contents) => {
      const file = new File([contents], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return 'the place you picked'; }
        catch (e) { if (e && e.name === 'AbortError') return false; }
      }
      const url = URL.createObjectURL(file), a = document.createElement('a');
      a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      return 'Downloads as ' + name;
    },
    openDataFolder: async () => {}
  };

  /* Ask the browser not to clear this app's storage under pressure (installed apps usually get it). */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* best effort */ }
  /* Offline use and installability. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();

/* ==== src/desktop_shim.js ==== */
/* desktop_shim.js: desktop build only. Gives the app the same window.claude.use() surface it gets inside Claude,
   backed by window.desktop (desktop_bridge.js): data files on this computer, Claude through the person's own
   Anthropic API key, and backups saved to Documents. The app code does not know which one it is running on. */
'use strict';
(() => {
  const D = window.desktop;
  if (!D) return;
  let cache = null;
  const all = async () => cache || (cache = await D.readAll());
  const snap = (id, v) => ({ id, exists: v !== undefined, data: () => v, metadata: { fromCache: false, hasPendingWrites: false } });
  const doc = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snap(p.split('/').pop(), (await all())[p]),
    set: async v => { const c = await all(); c[p] = JSON.parse(JSON.stringify(v)); await D.write(p, c[p]); },
    delete: async () => { const c = await all(); delete c[p]; await D.remove(p); }
  });
  const db = {
    doc,
    collection: c => ({
      path: c, doc: id => doc(c + '/' + id),
      get: async () => {
        const a = await all();
        const docs = Object.keys(a).filter(k => k.startsWith(c + '/') && k.split('/').length === 2).map(k => snap(k.split('/')[1], a[k]));
        return { docs, size: docs.length, empty: !docs.length };
      }
    })
  };
  const CODES = ['not_granted', 'rate_limited', 'prompt_too_large', 'refused', 'session_expired', 'upstream_error'];
  const toErr = e => { const m = String((e && e.message) || e); return { code: CODES.find(c => m.includes(c)) || 'upstream_error', message: m }; };
  /* Same tolerant reading as the viewer: whole reply, a fenced block, or first bracket to last bracket. */
  function parseJson(t) {
    const tries = [t, (t.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1]];
    const a = t.search(/[[{]/), b = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
    if (a >= 0 && b > a) tries.push(t.slice(a, b + 1));
    for (const x of tries) { if (!x) continue; try { return JSON.parse(x); } catch (e) { /* next */ } }
    return undefined;
  }
  const text = input => typeof input === 'string' ? input : input.map(m => m.content).join('\n\n');
  function makeSample() {
    const s = async input => { try { return { text: await D.ask(text(input)), truncated: false }; } catch (e) { throw toErr(e); } };
    s.json = async input => {
      let t;
      try { t = await D.ask(text(input) + '\n\nYour reply will be machine-parsed: reply with only the JSON value, no other text.'); } catch (e) { throw toErr(e); }
      const v = parseJson(t);
      if (v === undefined) throw { code: 'invalid_json', message: 'Reply was not JSON', text: t };
      return v;
    };
    return s;
  }
  window.claude = {
    use: async name => {
      if (name === 'db') return db;
      if (name === 'sample') return (await D.hasKey()) ? makeSample() : null;
      if (name === 'downloads') return { save: async ({ filename, data }) => { let r; try { r = await D.saveFile(filename, String(data)); } catch (e) { throw { code: 'unavailable', message: String(e && e.message || e) }; } if (!r) throw { code: 'cancelled', message: 'Save cancelled' }; return typeof r === 'string' ? r : 'saved'; } };
      return null;
    }
  };
})();

/* ---------- sound and wake lock ---------- */
let audioCtx = null;
function chime() {
  if (!app() || !app().sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [660, 880].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.18); g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.18 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.5);
      o.connect(g).connect(audioCtx.destination); o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.55);
    });
  } catch (e) { /* no audio here */ }
}
let wakeLock = null;
async function holdWake(on) {
  try { if (on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; }
}

/* ---------- session engine ---------- */
function targetText(coll, doc) { return coll === 'pieces' ? doc.text || '' : L.mainText(doc); }

const Engine = {
  s: null, _iv: 0, _last: 0, _saved: 0, _chimed: false, done: null,

  start(kind, opts) {
    opts = opts || {};
    const a = app(), today = L.iso(), data = Object.assign({}, opts.data || {});
    if (kind === 'phase1' || kind === 'short') data.topic = data.topic || TOPICS[(sessions().length * 7) % TOPICS.length];
    if (kind === 'phase1' && !data.modelId) data.modelId = L.nextModel(allModels(), 'essay', sessions()).id;
    if ((kind === 'franklin1' || kind === 'franklin3') && !data.modelId) data.modelId = L.nextModel(allModels(), a.phase >= 3 ? a.form : 'essay', sessions()).id;
    if (kind === 'combining' && !data.setId) {
      const used = new Set(sessions().filter(s => s.kind === 'combining').map(s => s.data && s.data.setId));
      data.setId = (COMBINING.find(c => !used.has(c.id)) || COMBINING[sessions().length % COMBINING.length]).id;
      data.ways = ['', '', ''];
    }
    if (kind === 'franklin2') {
      const notes = Store.get('sessions', data.notesId);
      data.notes = notes ? notes.data.notes.slice() : [];
      if (data.shuffled) data.order = L.shuffleOrder(data.notes.length, data.notesId);
    }
    if (kind === 'piece') {
      let p = data.pieceId && Store.get('pieces', data.pieceId);
      if (!p) {
        p = { id: newId('p'), phase: a.phase, form: a.phase >= 3 ? a.form : 'essay', title: '', status: 'plan', createdAt: nowIso(), finishedAt: '',
          plan: { point: '', reader: '', notes: '' }, text: '', versions: [], checks: {}, feedback: [], postedUrl: '', publishedUrl: '', words: 0, marks: [], reviewed: false, reviewedAt: '' };
        Store.put('pieces', p.id, p, true);
      }
      data.pieceId = p.id; data.minutes = opts.minutes || data.minutes || 25; data.wordsBefore = L.countWords(p.text);
    }
    const s = { id: newId('s'), kind, phase: a.phase, date: today, status: 'active', startedAt: nowIso(), finishedAt: '', step: 0, stepElapsed: 0, seconds: 0, words: 0,
      data, marks: [], reviewed: false, reviewedAt: '' };
    Store.put('sessions', s.id, s, true);
    this.open(s, false);
  },

  open(s, resumed) {
    this.s = clone(s); this.done = null;
    if (resumed && this.step() && this.step().sprint) { this.sprint().interrupted = true; this.save(); }
    this._last = Date.now(); this._chimed = this.remaining() <= 0;
    clearInterval(this._iv); this._iv = setInterval(() => this.tick(), 1000);
    holdWake(true); showFocus();
  },
  flow() { return L.flowFor(this.s.kind, this.s.data); },
  step() { return this.flow()[this.s.step]; },
  remaining() { const st = this.step(); return st ? st.min * 60 - this.s.stepElapsed : 0; },
  sprint() { return this.s.data.sprint || (this.s.data.sprint = { words: 0, maxPause: 0, paused: 0, interrupted: false, seconds: 0, lastInput: 0 }); },

  tick() {
    if (!this.s || this.done) return;
    const now = Date.now(), dt = Math.min(5, (now - this._last) / 1000); this._last = now;
    this.s.stepElapsed += dt; this.s.seconds += dt;
    const st = this.step();
    if (st && st.sprint) {
      const sp = this.sprint();
      if (this.remaining() > 0) {   // only the timed window counts toward "without stopping"
        const idle = this.s.stepElapsed - (sp.lastInput || 0);
        if (idle > sp.maxPause) sp.maxPause = idle;
        sp.words = L.countWords(this.s.data.text);
      }
    }
    if (!this._chimed && this.remaining() <= 0) { this._chimed = true; chime(); }
    Focus.updateClock();
    if (now - this._saved > 5000) this.save();
  },
  /* Called by guarded sprint textareas on every input. */
  onSprintInput() {
    const sp = this.sprint(), t = this.s.stepElapsed;
    if (this.remaining() <= 0) { sp.lastInput = t; return; }
    const gap = t - (sp.lastInput || 0);
    if (gap > (app().pauseLimit || 60)) sp.paused++;
    if (gap > sp.maxPause) sp.maxPause = gap;
    sp.lastInput = t;
    if (this.remaining() > 0) sp.words = L.countWords(this.s.data.text);
  },
  save() {
    if (!this.s) return;
    this._saved = Date.now();
    const s = this.s;
    s.words = s.kind === 'piece' ? Math.max(0, L.countWords((Store.get('pieces', s.data.pieceId) || {}).text) - (s.data.wordsBefore || 0)) : L.countWords(L.mainText(s));
    Store.put('sessions', s.id, clone(s), true);
  },
  next() {
    const st = this.step();
    if (st && st.sprint) {
      const sp = this.sprint();
      const idle = Math.min(this.s.stepElapsed, st.min * 60) - (sp.lastInput || 0);
      if (idle > (app().pauseLimit || 60)) sp.paused++;
      sp.seconds = Math.min(this.s.stepElapsed, st.min * 60);
      if (this.remaining() > 0) sp.words = L.countWords(this.s.data.text);
    }
    if (this.s.step < this.flow().length - 1) {
      this.s.step++; this.s.stepElapsed = 0; this._chimed = false; this.save(); showFocus();
    } else this.finish();
  },
  finish() {
    const s = this.s;
    s.status = 'done'; s.finishedAt = nowIso();
    if (s.data.sprint) delete s.data.sprint.lastInput;
    logSelfMarks('sessions', s);
    this.save();
    if (s.kind === 'piece') { const p = Store.get('pieces', s.data.pieceId); if (p) Store.put('pieces', p.id, Object.assign(clone(p), { words: L.countWords(p.text) }), true); }
    clearInterval(this._iv); holdWake(false);
    this.done = s.id; showFocus();
  },
  quit(keep) {
    clearInterval(this._iv); holdWake(false);
    if (!keep && this.s) Store.remove('sessions', this.s.id); else if (this.s) this.save();
    this.s = null; this.done = null; hideFocus();
  },
  close() { this.s = null; this.done = null; hideFocus(); }
};

/* ---------- marks and the error log ---------- */
/* Self marks are logged once, when the session ends (or immediately outside a session). */
function logMark(m) {
  if (m.errId || !m.type) return m;
  const id = L.errorId(m.type, m.quote);
  const row = L.logError(Store.get('errors', id), { type: m.type, wrote: m.quote, correct: m.fix, by: m.by === 'self' ? 'self' : 'claude', date: L.iso() });
  Store.put('errors', row.id, row, true);
  m.errId = row.id;
  return m;
}
function logSelfMarks(coll, doc) { for (const m of doc.marks || []) if (m.by === 'self') logMark(m); }
function addMark(coll, id, mark) {
  const doc = clone(Store.get(coll, id));
  doc.marks = (doc.marks || []).concat([coll === 'sessions' && doc.status === 'active' ? mark : logMark(mark)]);
  Store.put(coll, id, doc);
}
function removeMark(coll, id, idx) {
  const doc = clone(Store.get(coll, id)); const m = doc.marks[idx];
  if (m && m.errId) {
    const row = Store.get('errors', m.errId);
    if (row) { const r = clone(row); const i = r.dates.lastIndexOf(L.iso()); r.dates.splice(i >= 0 ? i : r.dates.length - 1, 1); if (r.dates.length) Store.put('errors', r.id, r, true); else Store.remove('errors', r.id); }
  }
  doc.marks.splice(idx, 1); Store.put(coll, id, doc);
}
function setFixed(coll, id, idx, fix) {
  const doc = clone(Store.get(coll, id)); const m = doc.marks[idx];
  m.fixed = true; m.fix = fix; m.lastHint = '';
  if (m.errId && Store.get('errors', m.errId)) { const r = clone(Store.get('errors', m.errId)); r.correct = fix; Store.put('errors', r.id, r, true); }
  Store.put(coll, id, doc);
}

const SAMPLE_MSG = {

  prompt_too_large: 'This text is too long to review in one go.'

async function claudeReview(coll, id) {
  const doc = Store.get(coll, id); const text = targetText(coll, doc);

async function claudeRepair(coll, id, idx, fix) {

/* ==== src/app_focus.js ==== */
/* app_focus.js: the full-screen session steps. Each step returns {el, ready} where ready() gives a blocking reason or null. */
'use strict';

const STEP_NAME = { copy: 'Copy', write: 'Write', check: 'Check', read: 'Read', notes: 'Notes', order: 'Order', rebuild: 'Rebuild', compare: 'Compare',
  combine: 'Combine', source: 'Article', point: 'Point', draft: 'Draft', link: 'Link', close: 'Close', study: 'Study', practice: 'Practice', work: 'Work' };

/* A writing surface. Paste is always off. In a sprint step with "no deleting" on, deletion is off too. */
function writeArea(o) {
  const ta = h('textarea', { id: o.id, class: 'sheet' + (o.small ? ' small' : ''), rows: o.rows || 10, placeholder: o.placeholder || '', value: o.value || '',
    spellcheck: false, autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences', 'data-gramm': 'false', 'data-gramm_editor': 'false', 'data-enable-grammarly': 'false',
    'aria-label': o.label || 'Your writing' });
  const say = msg => { if (o.flash) o.flash(msg); };
  const noPaste = e => { e.preventDefault(); say('Paste is off. Write every word yourself.'); };
  ta.addEventListener('paste', noPaste); ta.addEventListener('drop', noPaste);
  if (o.noDelete) {
    ta.addEventListener('keydown', e => {
      if (e.key === 'Backspace' || e.key === 'Delete' || ((e.ctrlKey || e.metaKey) && /^[zxy]$/i.test(e.key))) { e.preventDefault(); say('No deleting in this step. Keep going and fix it in the check.'); }
    });
    ta.addEventListener('beforeinput', e => { if (/^delete|^history/.test(e.inputType)) { e.preventDefault(); say('No deleting in this step. Keep going.'); } });
    ta.addEventListener('cut', e => e.preventDefault());
  }
  ta.addEventListener('input', () => o.oninput(ta.value));
  return ta;
}

function showFocus() {
  const root = document.getElementById('focus');
  root.hidden = false; document.body.classList.add('in-focus');
  root.replaceChildren(Engine.done ? doneScreen() : stepScreen());
  Focus.updateClock();
  const first = root.querySelector('textarea:not([readonly]), input[type=text]');
  if (first && !Engine.done) setTimeout(() => first.focus({ preventScroll: true }), 30);
  root.scrollTop = 0;
}
function hideFocus() { document.getElementById('focus').hidden = true; document.body.classList.remove('in-focus'); render(); }

const Focus = {
  updateClock() {
    const el = document.getElementById('clock'); if (!el || !Engine.s) return;
    const r = Engine.remaining();
    el.textContent = r > 0 ? mmss(r) : '+' + mmss(-r);
    el.classList.toggle('over', r <= 0);
    const pm = document.getElementById('pausem');
    if (pm && Engine.s.data.sprint) {
      const sp = Engine.s.data.sprint, lim = app().pauseLimit || 60;
      const idle = Engine.remaining() > 0 ? Engine.s.stepElapsed - (sp.lastInput || 0) : 0;
      pm.textContent = 'Pause ' + mmss(idle) + ' of ' + mmss(lim) + (sp.paused ? ' · stopped ' + plural(sp.paused, 'time') : '');
      pm.classList.toggle('warn', idle > lim * 0.6 || sp.paused > 0);
    }
    const wc = document.getElementById('sprintwords');
    if (wc && Engine.s.data.sprint) wc.textContent = Engine.s.data.sprint.words + ' words' + (Engine.remaining() <= 0 ? ' in time' : '');
  }
};

function stepScreen() {
  const s = Engine.s, flow = Engine.flow(), st = Engine.step();
  const builder = STEPS[s.kind + ':' + st.id] || STEPS[st.id];
  const msg = h('p', { class: 'stepmsg', role: 'status' });
  const flash = t => { msg.textContent = t; msg.classList.add('on'); clearTimeout(msg._t); msg._t = setTimeout(() => msg.classList.remove('on'), 3500); };
  const step = builder(s, flash);
  const isLast = s.step === flow.length - 1;
  const nextBtn = h('button', { class: 'btn primary', id: 'next', onclick: () => {
    const why = step.ready ? step.ready() : null;
    if (why) { flash(why); return; }
    if (step.commit) step.commit();
    Engine.next();
  } }, isLast ? 'Finish' : 'Next: ' + STEP_NAME[flow[s.step + 1].id]);
  const stopWrap = h('div', { class: 'stop' });
  const stopBtn = h('button', { class: 'btn quiet', onclick: () => {
    stopWrap.replaceChildren(h('span', { class: 'muted' }, 'Stop this session?'),
      h('button', { class: 'btn quiet', onclick: () => Engine.quit(true) }, 'Keep it for later'),
      h('button', { class: 'btn quiet danger', onclick: () => Engine.quit(false) }, 'Discard'),
      h('button', { class: 'btn quiet', onclick: () => showFocus() }, 'Cancel'));
  } }, 'Stop');
  stopWrap.append(stopBtn);
  return h('div', { class: 'focus-inner' },
    h('header', { class: 'focus-head' },
      h('div', { class: 'fh-left' }, h('span', { class: 'eyebrow' }, KIND_LABEL[s.kind] + ' · Phase ' + s.phase),
        h('ol', { class: 'steps' }, flow.map((f, i) => h('li', { class: i < s.step ? 'past' : i === s.step ? 'now' : '' }, STEP_NAME[f.id], h('small', null, f.min + "'"))))),
      h('div', { class: 'clock', id: 'clock', 'aria-live': 'off' }, mmss(st.min * 60))),
    h('main', { class: 'focus-body' }, step.el),
    h('footer', { class: 'focus-foot' }, stopWrap, msg, nextBtn));
}

/* ---------- steps ---------- */
const STEPS = {
  copy(s, flash) {
    const m = modelById(s.data.modelId);
    return { el: h('div', { class: 'stack' },
      p('Copy this paragraph by hand, on paper. Copying puts native sentence patterns back in your hand without the pressure of inventing content.', 'lead'),
      modelBlock(m),
      p(['Or copy a paragraph from a ', h('a', { href: SITES[0][1], target: '_blank', rel: 'noopener' }, 'Paul Graham essay'), ' instead.'], 'muted small'),

      ready: () => s.data.copied ? null : 'Tick the box once you have copied it.' };
  },

  write(s, flash) {   // the sprint
    const d = s.data, a = app();
    const topic = h('p', { class: 'topic' }, d.topic);
    const other = h('button', { class: 'btn quiet small', hidden: !!(d.text || '').trim(), onclick: () => { const i = (TOPICS.indexOf(d.topic) + 1) % TOPICS.length; d.topic = TOPICS[i]; topic.textContent = d.topic; } }, 'Another topic');
    const ta = writeArea({ id: 'sprint', value: d.text, rows: 14, noDelete: a.noDelete, flash, placeholder: 'Start with the simplest true sentence.',
      oninput: v => { d.text = v; other.hidden = true; Engine.onSprintInput(); Focus.updateClock(); } });
    const rules = (s.phase || 1) === 1 ? PHASES[1].rules : [];
    return { el: h('div', { class: 'stack' },
      h('div', { class: 'topicrow' }, h('span', { class: 'eyebrow' }, 'Write about'), topic, other),
      rules.length ? h('ul', { class: 'rules' }, rules.map(r => h('li', null, r))) : '',
      ta,
      h('div', { class: 'meta' }, counter('sprintwords', (d.sprint ? d.sprint.words : 0) + ' words'), h('span', { class: 'pause', id: 'pausem' }, ''),
        h('span', { class: 'muted' }, a.noDelete ? 'No deleting, no checker. ' : '', 'Pause over ' + mmss(a.pauseLimit || 60) + ' breaks "without stopping".'))),
      ready: () => (d.text || '').trim() ? null : 'Write something first.' };

/* ---------- after the last step ---------- */
function doneScreen() {
  const s = Store.get('sessions', Engine.done) || Engine.s;
  const mins = Math.round(s.seconds / 60);
  const lines = [h('p', { class: 'lead' }, plural(mins, 'minute') + (s.words ? ', ' + plural(s.words, 'word') : '') + '.')];
  const sp = s.data.sprint;
  if (sp) {
    const lim = app().pauseLimit || 60, clean = L.sprintClean(sp, lim);
    lines.push(h('p', { class: clean ? 'good' : 'note' }, plural(sp.words, 'word') + ' in ' + mmss(sp.seconds) + '. ' +
      (sp.interrupted ? 'The page was reloaded mid-write, so this one does not count as "without stopping".' : clean ? 'No pause over ' + mmss(lim) + '.' : 'Longest pause ' + mmss(sp.maxPause) + ', over the ' + mmss(lim) + ' limit.') +
      (L.sprintPasses(sp, lim) ? ' This meets the 150-words gate.' : '')));
  }
  if (s.kind === 'franklin1') lines.push(p('Notes saved and the original put away. The rebuild comes up after at least one more day and one other drill.', 'note'));
  if (s.kind === 'franklin2' || s.kind === 'franklin3') lines.push(p(s.data.keptAll ? 'Your version kept every idea of the original.' : 'Some ideas were lost. That rebuild does not count toward the gate, but the comparison is the learning.', s.data.keptAll ? 'good' : 'note'));
  const reviewable = s.kind !== 'franklin1' && s.kind !== 'piece' && L.mainText(s).trim();
  return h('div', { class: 'focus-inner done' },
    h('header', { class: 'focus-head' }, h('div', { class: 'fh-left' }, h('span', { class: 'eyebrow' }, KIND_LABEL[s.kind]), h('h2', null, 'Session done'))),
    h('main', { class: 'focus-body' }, h('div', { class: 'stack' }, lines, reviewable ? reviewBox('sessions', s.id) : '')),
    h('footer', { class: 'focus-foot' },
      reviewable || s.kind === 'piece' ? h('button', { class: 'btn', onclick: () => { App.sel = s.kind === 'piece' ? { coll: 'pieces', id: s.data.pieceId } : { coll: 'sessions', id: s.id }; Engine.close(); go('writing'); } }, 'Open in Writing') : '',
      h('button', { class: 'btn primary', onclick: () => { Engine.close(); go('today'); } }, 'Back to Today')));
}

/* ==== src/app_views.js ==== */
/* app_views.js: Today, Plan, Writing, Errors, Progress, Setup, shared panels and charts. */
'use strict';

const VIEWS = [['today', 'Today'], ['plan', 'Plan'], ['writing', 'Writing'], ['errors', 'Errors'], ['progress', 'Progress'], ['setup', 'Setup']];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const card = (cls, ...kids) => h('section', { class: 'card ' + (cls || '') }, ...kids);
const meter = (have, need) => h('span', { class: 'bar', role: 'img', 'aria-label': have + ' of ' + need }, h('span', { style: 'width:' + Math.min(100, need ? have / need * 100 : 0) + '%' }));

function render() {
  const view = document.getElementById('view');
  App.today = L.iso();
  if (!document.getElementById('focus').hidden) { if (Engine.done) showFocus(); drawStatus(); return; }
  drawNav();
  if (Store.mode === 'loading') { view.replaceChildren(h('p', { class: 'muted pad' }, 'Opening your notebook…')); return; }
  if (!app()) { view.replaceChildren(onboarding()); drawStatus(); return; }
  const fn = { today: viewToday, plan: viewPlan, writing: viewWriting, errors: viewErrors, progress: viewProgress, setup: viewSetup }[App.route] || viewToday;
  const y = window.scrollY;
  view.replaceChildren(fn());
  window.scrollTo(0, y);
  drawStatus();
}
function go(route) { App.route = route; try { if (location.hash !== '#' + route) history.replaceState(null, '', '#' + route); } catch (e) { location.hash = route; } window.scrollTo(0, 0); render(); }

function drawNav() {
  const nav = document.getElementById('nav'), a = app();
  nav.replaceChildren(...VIEWS.map(([id, label]) => h('a', { href: '#' + id, class: App.route === id ? 'on' : '', 'aria-current': App.route === id ? 'page' : null,
    onclick: e => { e.preventDefault(); go(id); } }, label)));
  const ph = document.getElementById('phase');
  ph.replaceChildren(a ? h('div', null, h('span', { class: 'eyebrow' }, 'Phase ' + a.phase + ' of 4'), h('strong', null, PHASES[a.phase].name),
    h('span', { class: 'phasedots' }, [1, 2, 3, 4].map(n => h('i', { class: n < a.phase ? 'past' : n === a.phase ? 'now' : '' })))) : '');
}
function drawStatus() {
  const el = document.getElementById('status');
  const where = Store.mode === 'db' ? (window.desktop ? (window.desktop.kind === 'phone' ? 'Saved on this phone' : 'Saved on this computer') : 'Saved to your private app data') : Store.mode === 'local' ? 'Saved in this browser only' : '';
  el.replaceChildren(h('span', null, where), Store.status ? h('span', { class: 'warn' }, Store.status) : '', App.notice ? h('span', { class: 'warn' }, App.notice) : '');
  if (App.notice && !App._noticeT) App._noticeT = setTimeout(() => { App.notice = ''; App._noticeT = 0; drawStatus(); }, 6000);
}

/* ---------- shared panels ---------- */
function textWithMarks(text, marks) {
  const ms = (marks || []).map((m, i) => Object.assign({ n: i + 1 }, m)).filter(m => m.at >= 0 && text.slice(m.at, m.at + m.quote.length) === m.quote).sort((a, b) => a.at - b.at);
  const out = []; let pos = 0;
  for (const m of ms) {
    if (m.at < pos) continue;
    out.push(text.slice(pos, m.at), h('mark', { class: 'mk ' + (m.fixed ? 'fixed' : m.by), title: m.type }, m.quote, h('sup', null, m.n)));
    pos = m.at + m.quote.length;
  }
  out.push(text.slice(pos));
  return h('div', { class: 'prose' }, out);
}

function reviewBox(coll, id) {
  const doc = Store.get(coll, id); if (!doc) return '';
  const text = targetText(coll, doc);
  if (doc.reviewedAt) {
    const n = (doc.marks || []).filter(m => m.by === 'claude').length;
    return h('div', { class: 'review done' }, h('strong', null, 'Marked by Claude'), ' on ' + fmtDate(doc.reviewedAt) + ': ' + (n ? plural(n, 'problem') + '. Fix each one yourself below.' : 'no problems found.'));
  }
  if (App.busy[id]) return h('div', { class: 'review busy' }, App.busy[id]);
  const left = reviewsLeft(), a = app();
  const intro = h('p', null, 'Claude points at problems after the draft is done. It never rewrites anything, and you do the repair. ',
    h('span', { class: 'muted' }, plural(a.reviewsPerWeek || 1, 'review') + ' a week; ' + left + ' left this week.'));
  if (!text.trim()) return '';
  if (left <= 0) return h('div', { class: 'review' }, intro, h('p', { class: 'muted small' }, 'This week’s review is used. Self-check this one, or change the number in Setup.'));
  if (App.sample) return h('div', { class: 'review' }, intro, h('button', { class: 'btn primary', onclick: () => claudeReview(coll, id) }, 'Ask Claude to mark it'));
  /* Outside the Claude viewer: copy a request, paste the reply. */
  const out = h('p', { class: 'muted small' });
  const ta = h('textarea', { class: 'sheet small', rows: 4, placeholder: 'Paste Claude’s reply here', 'aria-label': 'Claude reply' });
  const prompt = L.reviewPrompt(text, currentTop3(), ERROR_TYPES);
  return h('div', { class: 'review' }, intro,
    h('p', { class: 'small' }, window.desktop ? 'To get reviews here, add your Anthropic API key in Setup. Or copy the request into a Claude chat and paste the reply back.' : 'Claude is not reachable from this page here. Copy the request into a Claude chat, then paste the reply back.'),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => copyText(prompt, out) }, 'Copy review request'), out), ta,
    h('button', { class: 'btn', onclick: () => {
      const marks = L.parsePastedMarks(ta.value, text, ERROR_TYPES);
      if (!marks) { out.textContent = 'No list of marks found in that reply. Paste the whole reply, including the [ ] brackets.'; return; }
      applyReview(coll, id, marks, 'paste');
    } }, 'Add the marks'));
}
function copyText(t, out) {
  const done = () => { if (out) out.textContent = 'Copied.'; };
  try { navigator.clipboard.writeText(t).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = h('textarea', { value: t, class: 'sheet small', rows: 4, readOnly: true }); out.replaceWith(ta); ta.select(); }
}

function marksPanel(coll, id) {
  const doc = Store.get(coll, id); const marks = (doc && doc.marks) || [];
  if (!marks.length) return '';
  const text = targetText(coll, doc);
  const fixed = marks.filter(m => m.fixed).length;
  return h('div', { class: 'marks' }, h('h3', null, 'Marks ', h('span', { class: 'muted' }, fixed + ' of ' + marks.length + ' fixed')),
    h('ol', null, marks.map((m, i) => {
      const sent = L.sentenceAround(text, m.at), k = sent.indexOf(m.quote);
      const before = k >= 0 ? sent.slice(0, k) : '', after = k >= 0 ? sent.slice(k + m.quote.length) : '';
      const cut = (s, end) => s.length <= 100 ? s : end ? s.slice(0, 100).replace(/\s\S*$/, '') + ' …' : '… ' + s.slice(-100).replace(/^\S*\s/, '');
      const ctx = k >= 0 ? [cut(before, false), h('mark', { class: 'mk ' + m.by }, m.quote), cut(after, true)] : ['“', m.quote, '”'];
      const key = id + ':' + i;
      const input = h('input', { type: 'text', 'aria-label': 'Your fix for mark ' + (i + 1), placeholder: 'Rewrite the marked words yourself', value: m.fix || '' });
      const canClaude = m.by === 'claude' && App.sample;
      return h('li', { class: m.fixed ? 'fixed' : '' },
        h('div', { class: 'mhead' }, h('span', { class: 'tag' }, m.type), h('span', { class: 'by' }, m.by === 'claude' ? 'Claude' : m.by === 'ai' ? 'old app' : 'you'),
          h('button', { class: 'icon', 'aria-label': 'Delete mark', onclick: () => removeMark(coll, id, i) }, '×')),
        h('p', { class: 'ctx' }, ctx),

function barChart(rows) {
  const W = 640, H = 180, pad = 28, n = rows.length, max = Math.max(150, ...rows.map(r => r.words));
  const bw = Math.min(46, (W - pad * 2) / n * 0.7), step = (W - pad * 2) / n;
  const nice = max <= 500 ? 100 : max <= 2000 ? 500 : 1000, top = Math.ceil(max / nice) * nice, y = v => H - 22 - v / top * (H - 40);
  const ns = 'http://www.w3.org/2000/svg', s = (t, at, txt) => { const e = document.createElementNS(ns, t); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': 'Words written per week' });
  for (let v = 0; v <= top; v += nice) { svg.append(s('line', { x1: pad, x2: W - 6, y1: y(v), y2: y(v), class: 'grid' }), s('text', { x: pad - 4, y: y(v) + 3, class: 'ax', 'text-anchor': 'end' }, v)); }
  rows.forEach((r, i) => {
    const x = pad + i * step + (step - bw) / 2;
    svg.append(s('rect', { x, y: y(r.words), width: bw, height: Math.max(0, H - 22 - y(r.words)), rx: 2, class: 'b' + (i === n - 1 ? ' last' : '') }));
    svg.append(s('text', { x: x + bw / 2, y: H - 8, class: 'ax', 'text-anchor': 'middle' }, 'W' + r.week));
    for (let k = 0; k < Math.min(7, r.sessions); k++) svg.append(s('circle', { cx: x + bw / 2, cy: y(r.words) - 8 - k * 7, r: 2.4, class: 'dot' }));
  });
  return svg;
}

/* ==== src/app_events.js ==== */
/* app_events.js: routing, import and export, boot. Input guards live with the writing surface (writeArea). */
'use strict';

function readImport(txt) {
  let obj;
  try { obj = JSON.parse(txt); } catch (e) { throw new Error('That is not valid JSON. Use the file from the old app’s Export button.'); }
  if (obj && obj.format === 'english-writing-recovery/v3') {
    const writes = []; const rep = { sources: ['Backup from this app'], sessions: 0, pieces: 0, errors: 0, models: 0 };
    if (!app() && obj.app) writes.push({ coll: 'state', id: 'app', doc: obj.app });
    for (const c of COLLS) for (const [id, doc] of Object.entries(obj[c] || {})) if (!Store.get(c, id)) { writes.push({ coll: c, id, doc }); if (c in rep) rep[c]++; }
    return { writes, report: rep };
  }
  const bundle = M.readBundle(obj);
  return M.mergePlan(Store.S, bundle, L.iso());
}

function exportData() {
  if (!App.downloads) return;
  App.downloads.save({ filename: 'english-writing-recovery-' + L.iso() + '.json', data: JSON.stringify(Store.dump(), null, 1) })
    .then(r => { App.notice = typeof r === 'string' && r !== 'saved' ? 'Backup saved to ' + r : ''; render(); })
    .catch(e => { App.notice = e && e.code === 'unavailable' ? 'Saving files is not available here.' : 'The backup was not saved.'; if (e && e.code === 'unavailable') App.downloads = null; render(); });
}

let renderQueued = false;
function queueRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

async function boot() {
  const routeFromHash = () => { const r = (location.hash || '').slice(1); return VIEWS.some(v => v[0] === r) ? r : null; };
  App.route = routeFromHash() || 'today';
  window.addEventListener('hashchange', () => { const r = routeFromHash(); if (r && r !== App.route) { App.route = r; render(); } });
  Store.onChange = queueRender;
  /* Phones: size the session screen to the visible area so its footer stays above the keyboard,
     and hide the tab bar while typing on a page. */
  if (window.visualViewport) {
    const vv = () => document.documentElement.style.setProperty('--vvh', Math.round(window.visualViewport.height) + 'px');
    window.visualViewport.addEventListener('resize', vv); vv();
  }
  const typing = e => e.target.matches && e.target.matches('#view input:not([type=checkbox]), #view textarea, #view select');
  document.addEventListener('focusin', e => { if (typing(e)) document.body.classList.add('kb'); });
  /* Bring the tab bar back only after the tap that moved focus has landed, so the layout does not shift under it. */
  document.addEventListener('focusout', e => {
    if (!typing(e)) return;
    setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches('#view input:not([type=checkbox]), #view textarea, #view select'))) document.body.classList.remove('kb'); }, 350);
  });
  render();
  await Store.init();
  render();
  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(s => { App.sample = s; queueRender(); }).catch(() => {});
    window.claude.use('downloads').then(d => { App.downloads = d; queueRender(); }).catch(() => {});
  }
  setInterval(() => { if (L.iso() !== App.today && document.getElementById('focus').hidden) render(); }, 60000);
  const flush = () => { if (Engine.s && !Engine.done) Engine.save(); Store.flush(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
}

boot();
