# Builds the Android app (recovery-app/android) from the phone page and publishes the APK as a release.
# Download link for the newest build (the android-download branch holds only that file):
#   https://github.com/Abdallah-Salaheldean-Salem/English/raw/refs/heads/android-download/EnglishWritingRecovery.apk
# Signing: repository secrets ANDROID_KEYSTORE_B64 (the .jks file, base64) and ANDROID_KEYSTORE_PASS.
# Every release must be signed with the same key, or Android refuses to install it over the old one.
# Without the secrets the APK is built and left unsigned in a draft release; recovery-app/tools/apk_sign_v2.py
# signs it with the same key, and the signed file goes on the android-download branch by hand.
name: Android app

on:
  push:
    branches: [main, claude/android-app]
    paths: ['recovery-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the page
        working-directory: recovery-app
        run: python3 build.py

      - name: Put the phone page into the app
        run: |
          W=recovery-app/android/app/src/main/assets/www
          mkdir -p "$W"
          cp recovery-app/pwa/index.html recovery-app/pwa/icon-192.png recovery-app/pwa/icon-512.png recovery-app/pwa/apple-touch-icon.png recovery-app/pwa/manifest.webmanifest "$W"/

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ewr.jks"
            echo "EWR_KEYSTORE=$RUNNER_TEMP/ewr.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so the APK is built but not published."
          fi

      - name: Build the APK
        env:
          EWR_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: gradle -p recovery-app/android --no-daemon assembleRelease

      - name: Publish the release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp recovery-app/android/app/build/outputs/apk/release/app-release.apk EnglishWritingRecovery.apk
          gh release create "android-${{ github.run_number }}" EnglishWritingRecovery.apk \
            --target "${{ github.sha }}" --latest \
            --title "English Writing for Android (build ${{ github.run_number }})" \
            --notes "Open this page on the phone and tap EnglishWritingRecovery.apk to download it, then open the file and allow the install. A newer build installs over the old one and keeps your practice data."
          # Same file on the download branch, so the one link above always gets the newest build.
          D=$(mktemp -d); cp EnglishWritingRecovery.apk "$D"/; cd "$D"
          printf '# English Writing for Android\n\nNewest signed build: %s (run %s). Open EnglishWritingRecovery.apk on the phone and allow the install.\n' "${{ github.sha }}" "${{ github.run_number }}" > README.md
          git init -q -b android-download && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Android app build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" android-download

      - name: Hand over the unsigned build
        # Without the secrets the APK goes into a draft release (visible only to the repo's owner and
        # collaborators), so it can be signed elsewhere with the same key and published by hand.
        if: env.SIGNED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp recovery-app/android/app/build/outputs/apk/release/app-release-unsigned.apk EnglishWritingRecovery-unsigned.apk
          gh release create "unsigned-${{ github.run_number }}" EnglishWritingRecovery-unsigned.apk --draft \
            --target "${{ github.sha }}" --title "Unsigned build ${{ github.run_number }}" --notes "Not installable: sign with the ewr key first."
